# nginx in front of the static web export — reverse proxy / static server for
# self-hosting (see Dockerfile). Mirrors the headers in vercel.json.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 1m;

  # Security headers live in one include: nginx drops server-level add_header
  # lines in any location that sets its own, so every location includes them.
  include /etc/nginx/security-headers.inc;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  # Hashed bundles and assets never change → cache for a year (CDN friendly).
  location ~ ^/(_expo/static|assets)/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: every other path serves index.html, always revalidated.
  location / {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri.html /index.html;
  }
}
