# nginx in front of the static web export — reverse proxy / static server for
# self-hosting (see Dockerfile). Mirrors the headers in vercel.json.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 1m;

  # Security headers (clickjacking, MIME sniffing, CSP, HSTS behind TLS).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://exp.host https://api.pwnedpasswords.com; frame-src https://*.supabase.co; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  # Hashed bundles and assets never change → cache for a year (CDN friendly).
  location ~ ^/(_expo/static|assets)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: every other path serves index.html, always revalidated.
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri.html /index.html;
  }
}
