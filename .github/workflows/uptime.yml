# Uptime monitoring + alerting: every 15 minutes check the web app and the
# Supabase API. A failed run sends GitHub's failure e-mail to the repo owner
# (Settings → Notifications → Actions), so an outage is noticed within minutes.
name: Uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEB_URL: https://fahrschule-abgefahrn-student-app.vercel.app
      SUPABASE_URL: https://fzolxwxdeyshtodlikkl.supabase.co
    steps:
      - name: Web app responds (and is fast)
        run: |
          out=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 15 "$WEB_URL")
          echo "web: $out"
          [ "${out%% *}" = "200" ]
          awk -v t="${out##* }" 'BEGIN { exit !(t < 5) }'
      - name: Supabase Auth healthy
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "::warning::secret SUPABASE_ANON_KEY not set — skipping API check"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/health")
          echo "auth health: $code"
          [ "$code" = "200" ]
      - name: Security headers still present
        run: |
          curl -sI --max-time 15 "$WEB_URL" > h.txt
          for h in strict-transport-security content-security-policy x-frame-options x-content-type-options; do
            grep -qi "^$h:" h.txt || { echo "missing $h"; exit 1; }
          done
