# Uptime monitoring + alerting: every 15 minutes check the web app and the
# Supabase API. A failed run sends GitHub's failure e-mail to the repo owner
# (Settings → Notifications → Actions), so an outage is noticed within minutes.
name: Uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEB_URL: https://fahrschule-abgefahrn-student-app.vercel.app
      SUPABASE_URL: https://fzolxwxdeyshtodlikkl.supabase.co
    steps:
      - name: Web app responds (and is fast)
        run: |
          out=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 15 "$WEB_URL")
          echo "web: $out"
          [ "${out%% *}" = "200" ]
          awk -v t="${out##* }" 'BEGIN { exit !(t < 5) }'
      - name: Supabase API healthy (Auth + database)
        env:
          # The publishable key is public by design (it ships inside the web app
          # and the mobile apps); Row Level Security protects the data, so it
          # doesn't need to be a secret. A repo secret of the same name wins.
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_rPRvwTMIBrvVN-PzsIJEVw_-iX_k5iY' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/auth/v1/health")
          echo "auth health: $code"
          [ "$code" = "200" ]
          # Database reachable through PostgREST (feature_flags() is public).
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' -d '{}' "$SUPABASE_URL/rest/v1/rpc/feature_flags")
          echo "database (rpc feature_flags): $code"
          [ "$code" = "200" ]
      - name: Security headers still present
        run: |
          curl -sI --max-time 15 "$WEB_URL" > h.txt
          for h in strict-transport-security content-security-policy x-frame-options x-content-type-options; do
            grep -qi "^$h:" h.txt || { echo "missing $h"; exit 1; }
          done
