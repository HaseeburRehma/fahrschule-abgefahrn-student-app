# Dependency updates.
#  - npm: security fixes only. Dependabot security updates open a PR as soon as
#    GitHub knows about a vulnerability; routine version bumps are off
#    (open-pull-requests-limit: 0) because Expo pins most packages to the SDK —
#    SDK upgrades are planned by hand with a native build (see docs/OPERATIONS.md).
#  - GitHub Actions: one grouped PR per month.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
