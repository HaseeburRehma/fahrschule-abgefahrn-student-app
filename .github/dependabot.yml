# Dependency vulnerabilities: weekly update PRs for npm packages and GitHub
# Actions (security fixes arrive as soon as GitHub knows about them).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns: ['expo*', '@expo/*', 'react-native*']
    ignore:
      # Expo SDK upgrades are planned by hand (native build + store release).
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
